[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxa-governance"
version = "1.0.0"
description = "Voxa Layer 5 — Voice Governance Engine"
requires-python = ">=3.12"
dependencies = [
    "voxa-core",
    "pydantic>=2.0",
    "structlog>=24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voxa_governance"]
