[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxa-profile"
version = "1.0.0"
description = "Voxa Layer 2 — Canonical Voice Profile"
requires-python = ">=3.12"
dependencies = [
    "voxa-core",
    "pydantic==2.13.4",
    "structlog==26.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voxa_profile"]
