[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxa-calibration"
version = "1.0.0"
description = "Voxa Layer 4 — Calibration Engine"
requires-python = ">=3.12"
dependencies = [
    "voxa-core",
    "voxa-profile",
    "voxa-rendering",
    "pydantic==2.13.4",
    "structlog==26.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voxa_calibration"]
