[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxa-api"
version = "1.0.0"
description = "Voxa FastAPI application — endpoints, repositories, middleware"
requires-python = ">=3.12"
dependencies = [
    "voxa-core",
    "voxa-humanisation",
    "voxa-profile",
    "voxa-rendering",
    "voxa-calibration",
    "voxa-governance",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "structlog>=24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voxa_api"]
