[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxa-api"
version = "1.0.0"
description = "Voxa FastAPI application — endpoints, repositories, middleware"
requires-python = ">=3.12"
dependencies = [
    "voxa-core",
    "voxa-humanisation",
    "voxa-profile",
    "voxa-rendering",
    "voxa-calibration",
    "voxa-governance",
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "structlog==26.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voxa_api"]
