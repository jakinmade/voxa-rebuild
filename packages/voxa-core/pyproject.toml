[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxa-core"
version = "1.0.0"
description = "Voxa shared data entities, schemas, and base types"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.4",
    "structlog==26.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voxa_core"]
