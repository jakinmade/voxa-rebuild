[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxa-rendering"
version = "1.0.0"
description = "Voxa Layer 3 — Voice Rendering Engine"
requires-python = ">=3.12"
dependencies = [
    "voxa-core",
    "pydantic==2.13.4",
    "structlog==26.1.0",
    "httpx==0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voxa_rendering"]
