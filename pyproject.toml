[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxa"
version = "9.2.0"
description = "Governed Communication Identity System"
requires-python = ">=3.12"
dependencies = [
    "voxa-core",
    "voxa-humanisation",
    "voxa-profile",
    "voxa-rendering",
    "voxa-calibration",
    "voxa-governance",
    "voxa-api",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
supabase = [
    "supabase>=2.0",
]
redis = [
    "redis>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
