[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxa"
version = "9.5.0"
description = "Governed Communication Identity System"
requires-python = ">=3.12"
# Runtime dependencies — installed when any subpackage is installed
# The subpackages themselves are installed via requirements.txt or setup.py
# Pinned exact (15 Aug 2026) — kept in sync with requirements.txt's pins.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "structlog==26.1.0",
]

[tool.hatch.build.targets.wheel]
# Root package has no Python source — subpackages are in packages/
packages = []
include = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
