[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxa"
version = "9.5.0"
description = "Governed Communication Identity System"
requires-python = ">=3.12"
# Runtime dependencies — installed when any subpackage is installed
# The subpackages themselves are installed via requirements.txt or setup.py
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "structlog>=24.0",
]

[tool.hatch.build.targets.wheel]
# Root package has no Python source — subpackages are in packages/
packages = []
include = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
