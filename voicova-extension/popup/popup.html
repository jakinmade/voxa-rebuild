<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>VOICOVA</title>
  <style>
    body { width: 220px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; padding: 12px; margin: 0; color: #111827; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .status { margin-bottom: 8px; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .status-connected .status-dot { background: #027a48; }
    .status-disconnected .status-dot { background: #9ca3af; }
    .allowance { color: #6b7280; margin-bottom: 10px; }
    button { width: 100%; padding: 6px; border-radius: 6px; border: 1px solid #d0d5dd; background: #fff; cursor: pointer; }
    button:hover { background: #f4f5f7; }
  </style>
</head>
<body>
  <h1>VOICOVA</h1>
  <div id="status" class="status"></div>
  <div id="allowance" class="allowance"></div>
  <button id="disconnect" type="button">Disconnect</button>
  <script src="../shared/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
